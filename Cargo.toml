[workspace]
resolver = "2"
members = ["contracts/escrow"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TalentTrust"]
license = "MIT"
rust-version = "1.75"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
